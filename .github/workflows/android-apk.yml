name: 生成安卓 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - name: 构建内置网页
        run: GITHUB_REPOSITORY= pnpm run build:pages
      - name: 创建安卓应用
        run: pnpm exec cap add android
      - name: 加入安卓文件导出支持
        run: |
          cp android-overlay/MainActivity.java android/app/src/main/java/cn/zhangruijunlaoshi/rundown/MainActivity.java
          sed -i 's/minSdkVersion = 23/minSdkVersion = 29/' android/variables.gradle
      - name: 生成 APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: 保存 APK
        uses: actions/upload-artifact@v4
        with:
          name: 新媒体串单-安卓安装包
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
